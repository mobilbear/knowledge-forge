[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-forge"
version = "1.6.0"
description = "Personal knowledge base pipeline: capture, govern, navigate, brief"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.19"]

[project.optional-dependencies]
capture = ["trafilatura>=1.8", "yt-dlp>=2025.1", "markdownify>=0.13"]
speech = ["numpy", "pywhispercpp"]
browser = ["playwright>=1.44"]
ocr = ["paddleocr>=2.7"]
dev = ["pytest>=8.0"]

[project.scripts]
kf = "knowledge_forge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/knowledge-forge/config" = ["config/*.yaml"]
"share/knowledge-forge/schemas" = ["schemas/*.json"]
"share/knowledge-forge/prompts/classify" = ["prompts/classify/*.md"]
"share/knowledge-forge/prompts/quality_check" = ["prompts/quality_check/*.md"]
"share/knowledge-forge/prompts/summarize" = ["prompts/summarize/*.md"]
"share/knowledge-forge/prompts/synthesize" = ["prompts/synthesize/*.md"]
"share/knowledge-forge/skills/knowledge-forge" = ["skills/knowledge-forge/*.md"]
"share/knowledge-forge/skills/knowledge-forge/references" = ["skills/knowledge-forge/references/*.md"]

[tool.pytest.ini_options]
markers = ["network: tests requiring live network access"]
testpaths = ["tests"]
